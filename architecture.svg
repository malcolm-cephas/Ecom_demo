<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="600" fill="#0f172a" rx="16" />
  
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <dropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38bdf8" />
    </filter>
    <filter id="cardShadow">
      <dropShadow dx="0" dy="4" stdDeviation="10" flood-opacity="0.5" />
    </filter>
    
    <!-- Arrowhead -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
    <marker id="arrowhead-rest" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="arrowhead-mcp" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981" />
    </marker>
  </defs>

  <!-- Central Hub: Spring Boot -->
  <g transform="translate(400, 250)">
    <rect x="0" y="0" width="200" height="100" rx="12" fill="url(#hubGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#cardShadow)" />
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">Spring Boot</text>
    <text x="100" y="70" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Backend (HUB)</text>
  </g>

  <!-- React Frontend -->
  <g transform="translate(400, 50)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc" text-anchor="middle">React Frontend</text>
  </g>

  <!-- MCP Server -->
  <g transform="translate(100, 260)">
    <rect x="0" y="0" width="180" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <text x="90" y="40" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">MCP Server</text>
    <text x="90" y="60" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">(Tool Provider)</text>
  </g>

  <!-- MCP Client -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="180" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <text x="90" y="40" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">MCP Client</text>
    <text x="90" y="60" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">(Tool Consumer)</text>
  </g>

  <!-- Claude Desktop -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="180" height="60" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <text x="90" y="35" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">Claude Desktop</text>
  </g>

  <!-- External Tools -->
  <g transform="translate(60, 540)">
    <rect x="0" y="0" width="260" height="40" rx="8" fill="#0f172a" stroke="#475569" stroke-dasharray="4 2" />
    <text x="130" y="25" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Postman / AI Chats / Automation</text>
  </g>

  <!-- Connectors -->
  
  <!-- React -> Spring Boot (REST) -->
  <line x1="500" y1="130" x2="500" y2="240" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowhead-rest)" />
  <text x="510" y="190" font-family="Arial, sans-serif" font-size="12" fill="#38bdf8" font-weight="bold">REST</text>

  <!-- MCP Server -> Spring Boot (REST) -->
  <line x1="280" y1="300" x2="390" y2="300" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowhead-rest)" />
  <text x="320" y="290" font-family="Arial, sans-serif" font-size="12" fill="#38bdf8" font-weight="bold">REST</text>

  <!-- MCP Client -> MCP Server (MCP) -->
  <line x1="190" y1="420" x2="190" y2="350" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead-mcp)" />
  <text x="200" y="390" font-family="Arial, sans-serif" font-size="12" fill="#10b981" font-weight="bold">MCP</text>

  <!-- Claude Desktop -> MCP Server (MCP) -->
  <line x1="190" y1="160" x2="190" y2="250" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead-mcp)" />
  <text x="200" y="210" font-family="Arial, sans-serif" font-size="12" fill="#10b981" font-weight="bold">MCP</text>

  <!-- External Tools -> MCP Client -->
  <line x1="190" y1="540" x2="190" y2="510" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)" />

</svg>
