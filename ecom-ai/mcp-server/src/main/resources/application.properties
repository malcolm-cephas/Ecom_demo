server.port=9091

# Backend Configuration
app.backend.url=http://localhost:8080/api

# MCP Server Configuration
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.sse-endpoint=/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message
spring.ai.mcp.server.tools.objects=productMcpTools,dataAnalyticsTools
spring.ai.mcp.server.tools.scan-packages=com.malcolm.ecomai.mcp

# Enable the MethodToolCallback infrastructure for @Tool annotations
spring.ai.tool.method.enabled=true

# Security Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springaicommunity=DEBUG
logging.level.org.springframework.web=DEBUG
spring.mvc.log-request-details=true
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.org.springframework.boot=INFO

# OAuth2 Authorization Server Configuration
spring.security.oauth2.authorizationserver.client.oidc-client.registration.client-id=mcp-client
spring.security.oauth2.authorizationserver.client.oidc-client.registration.client-secret={noop}secret
spring.security.oauth2.authorizationserver.client.oidc-client.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.oidc-client.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.oidc-client.registration.scopes=openid
