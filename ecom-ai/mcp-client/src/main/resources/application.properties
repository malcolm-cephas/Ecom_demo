server.port=9090

# OpenAI Configuration (Used for Groq provider)
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile


# MCP Client Configuration (Manual)
spring.ai.mcp.client.enabled=false
spring.ai.mcp.client.toolcallback.enabled=false

# OAuth2 Client Configuration
# We register the client to talk to the MCP Server (which acts as Auth Server)
spring.security.oauth2.client.registration.mcp-client.provider=mcp-server-provider
spring.security.oauth2.client.registration.mcp-client.client-id=mcp-client
spring.security.oauth2.client.registration.mcp-client.client-secret=secret
spring.security.oauth2.client.registration.mcp-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.mcp-client.scope=openid

# Provider Details (The MCP Server itself)
spring.security.oauth2.client.provider.mcp-server-provider.token-uri=http://localhost:9091/oauth2/token

# Logging configurations
logging.level.org.springframework.ai=DEBUG
logging.level.web=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.org.springframework.boot=INFO

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL Initialization
spring.sql.init.mode=always
# Spring AI provides the schema script. For MySQL, it's usually at:
# classpath:org/springframework/ai/chat/memory/repository/jdbc/schema-mysql.sql
spring.sql.init.schema-locations=classpath:org/springframework/ai/chat/memory/repository/jdbc/schema-mysql.sql,classpath:schema-custom.sql

