server.port=8082
spring.application.name=ecom-agent

# Backend connection
app.backend.url=http://localhost:8080/api

# Groq API configuration for Spring AI (Primary)
spring.ai.openai.api-key=dummy-key
spring.ai.openai.base-url=http://localhost:4000
spring.ai.openai.chat.options.model=proxy-controlled-model
spring.ai.openai.chat.options.temperature=0.0

# OpenRouter Fallback Keys
app.openrouter.key1=${OPENROUTER_API_KEY_1}
app.openrouter.key2=${OPENROUTER_API_KEY_2}
